<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Google shows a site icon only if it is square and a multiple of 48px -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- `js`: scroll-reveal styles only apply once JS runs, so pre-rendered HTML stays visible.
         Splash: plays once per session and never with reduced motion. (`splash-on` is removed when it ends; `splash-play` stays to time the hero.) -->
    <script>
      (function () {
        var d = document.documentElement
        d.classList.add('js')
        try {
          if (matchMedia('(prefers-reduced-motion: reduce)').matches || sessionStorage.getItem('abx-splash')) {
            d.classList.add('no-splash')
          } else {
            sessionStorage.setItem('abx-splash', '1')
            d.classList.add('splash-on', 'splash-play')
          }
          // hero signature: full entrance once per session
          if (sessionStorage.getItem('abx-hero')) d.classList.add('hero-seen')
        } catch (e) {
          d.classList.add('splash-on', 'splash-play')
        }
      })()
    </script>
    <link rel="preload" as="image" type="image/webp" href="/brand/splash-mark-light.webp" />
    <link rel="preload" as="image" type="image/webp" href="/brand/splash-mark-orange.webp" />
    <link rel="preload" as="image" type="image/webp" href="/brand/splash-wordmark-light.webp" />
    <link rel="preload" as="image" type="image/webp" href="/brand/splash-software-light.webp" />
    <link rel="preload" as="image" type="image/webp" href="/brand/splash-lines.webp" />

    <!-- Page title and description are injected per route (see src/pages/*) -->
    <meta name="author" content="Abnexa" />
    <meta name="application-name" content="Abnexa" />
    <meta name="apple-mobile-web-app-title" content="Abnexa" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Local / geo targeting (constant across pages) -->

    <meta name="geo.placename" content="Karad, Maharashtra" />
    <meta name="ICBM" content="17.2893, 74.1809" />

    <!-- Constant social metadata — page-specific title/description/url/image are injected per page -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Abnexa" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
