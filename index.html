<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563EB" />

    <link rel="icon" type="image/png" href="/assets/Ab.png" />
    <link rel="apple-touch-icon" href="/assets/Ab.png" />

    <!-- Page title and description are injected per route (see src/pages/*) -->
    <meta name="author" content="AB Tech Services" />

    <!-- Local / geo targeting (constant across pages) -->
    <meta name="geo.region" content="IN-MH" />
    <meta name="geo.placename" content="Karad, Maharashtra" />
    <meta name="ICBM" content="17.2893, 74.1809" />

    <!-- Constant social metadata — page-specific title/description/url/image are injected per page -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AB Tech Services" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Poppins:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Site-level structured data (per-page LocalBusiness is injected by each page) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "AB Tech Services",
        "url": "https://abtechservices.store/",
        "publisher": {
          "@type": "Organization",
          "name": "AB Tech Services",
          "logo": "https://abtechservices.store/assets/Ab.png",
          "telephone": "+91 7666287015",
          "areaServed": "Maharashtra, India"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      AB Tech Services — Building Powerful Digital Solutions for Modern Businesses. Please enable JavaScript, or call +91 7666287015.
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
